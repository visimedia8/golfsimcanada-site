<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Golf Sim Space Calculator</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Golf Sim Space Calculator</h1>
      <p>Check if your room is ready for indoor golf.</p>
    </header>
    
    <main>
      <div class="input-group">
        <label for="height">Ceiling Height (ft)</label>
        <input type="number" id="height" placeholder="e.g. 10" step="0.5">
      </div>
      <div class="input-group">
        <label for="width">Room Width (ft)</label>
        <input type="number" id="width" placeholder="e.g. 12" step="0.5">
      </div>
      <div class="input-group">
        <label for="depth">Room Depth (ft)</label>
        <input type="number" id="depth" placeholder="e.g. 16" step="0.5">
      </div>
      
      <button id="calculate-btn">Check Dimensions</button>
      
      <div id="result-box" class="hidden">
        <h2 id="result-title">Result</h2>
        <p id="result-desc"></p>
      </div>
    </main>
    
    <footer>
      <p>Need help planning your space?</p>
      <a href="https://golfsimcanada.site/setup-guide" target="_blank" class="backlink">
        Read the Ultimate Setup Guide at GolfSimCanada
      </a>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
