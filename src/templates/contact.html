<!-- contact.html -->
<main class="contact-page py-12">
  <div class="container container-narrow">
    <!-- Breadcrumb -->
    <nav class="breadcrumb mb-6" aria-label="breadcrumb">
      <a href="/">Home</a> › <span>Contact & Installer Quotes</span>
    </nav>

    <header class="text-center mb-10">
      <span class="badge badge--featured mb-3">Canadian Quote Request</span>
      <h1 class="h1 text-white mb-4">Contact Golf Sim Canada</h1>
      <p class="text-xl text-secondary">
        Get free installation quotes from verified local Canadian installers, report venue updates, or contact our editorial team.
      </p>
    </header>

    <div class="card p-8 bg-surface mb-12">
      <form action="/contact/?submitted=true" method="POST" class="space-y-6">
        <div class="grid grid-2col gap-6">
          <div>
            <label for="contact-name" class="block text-xs font-semibold text-white mb-2">Full Name *</label>
            <input type="text" id="contact-name" name="name" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm" placeholder="e.g. Jean Tremblay" required>
          </div>
          <div>
            <label for="contact-email" class="block text-xs font-semibold text-white mb-2">Email Address *</label>
            <input type="email" id="contact-email" name="email" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm" placeholder="name@example.ca" required>
          </div>
        </div>

        <div class="grid grid-2col gap-6">
          <div>
            <label for="contact-province" class="block text-xs font-semibold text-white mb-2">Province *</label>
            <select id="contact-province" name="province" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm" required>
              <option value="">Select Province</option>
              <option value="ON">Ontario</option>
              <option value="BC">British Columbia</option>
              <option value="AB">Alberta</option>
              <option value="QC">Quebec</option>
              <option value="MB">Manitoba</option>
              <option value="NS">Nova Scotia</option>
              <option value="SK">Saskatchewan</option>
              <option value="NB">New Brunswick</option>
              <option value="NL">Newfoundland & Labrador</option>
              <option value="PE">Prince Edward Island</option>
            </select>
          </div>

          <div>
            <label for="contact-city" class="block text-xs font-semibold text-white mb-2">City / Location</label>
            <input type="text" id="contact-city" name="city" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm" placeholder="e.g. Calgary, Ottawa">
          </div>
        </div>

        <div class="grid grid-2col gap-6">
          <div>
            <label for="contact-budget" class="block text-xs font-semibold text-white mb-2">Budget Range (CAD) *</label>
            <select id="contact-budget" name="budget" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm" required>
              <option value="">Select Budget Range</option>
              <option value="under-3k">Under $3,000 CAD</option>
              <option value="3k-8k">$3,000 – $8,000 CAD</option>
              <option value="8k-20k">$8,000 – $20,000 CAD</option>
              <option value="20k-plus">$20,000+ CAD</option>
            </select>
          </div>

          <div>
            <label for="contact-space" class="block text-xs font-semibold text-white mb-2">Space Type</label>
            <select id="contact-space" name="space" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm">
              <option value="garage">Garage (Single / Double)</option>
              <option value="basement">Basement</option>
              <option value="dedicated">Dedicated Room</option>
              <option value="shed">Outdoor Shed / Outbuilding</option>
              <option value="commercial">Commercial Indoor Golf Venue</option>
            </select>
          </div>
        </div>

        <div>
          <label for="contact-timeline" class="block text-xs font-semibold text-white mb-2">Project Timeline</label>
          <select id="contact-timeline" name="timeline" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm">
            <option value="asap">ASAP (Next 30 days)</option>
            <option value="1-3-months">1 – 3 Months (Preparing for Winter)</option>
            <option value="3-6-months">3 – 6 Months</option>
            <option value="researching">Just Researching</option>
          </select>
        </div>

        <div>
          <label for="contact-message" class="block text-xs font-semibold text-white mb-2">Message or Space Dimensions (Optional)</label>
          <textarea id="contact-message" name="message" rows="4" class="w-full p-3 bg-base border border-color-border rounded text-white text-sm" placeholder="Include ceiling height, width, length, or specific launch monitor preferences if known..."></textarea>
        </div>

        <div class="flex items-start gap-3 p-4 bg-base rounded border border-color-border">
          <input type="checkbox" id="contact-casl" name="casl" class="mt-1" required>
          <label for="contact-casl" class="text-xs text-secondary leading-relaxed">
            I consent to be contacted by verified Canadian golf simulator installers regarding my inquiry in compliance with Canada's Anti-Spam Legislation (CASL). Your information is never sold to third parties.
          </label>
        </div>

        <button type="submit" class="btn btn--primary btn--lg w-full">Submit Inquiry →</button>
      </form>
    </div>
  </div>
</main>
